# $name theme for leaf.
# https://github.com/rose-pine/leaf

# leaf can't load .tmTheme files, so code blocks use a bundled syntect theme.
base = "$(ocean|ocean|arctic)"
syntax = "$(base16-ocean.dark|base16-ocean.dark|InspiredGitHub)"

[ui]
toc_bg = "$surface"
toc_border = "$highlightMed"
content_bg = "$base"
scrollbar_hover = "$rose"
status_bg = "$surface"
status_separator = "$muted"
status_brand_fg = "$base"
status_brand_bg = "$rose"
status_filename_fg = "$text"
status_filename_bg = "$overlay"
status_watch_fg = "$foam"
status_watch_bg = "$highlightLow"
status_reloaded_fg = "$base"
status_reloaded_bg = "$foam"
status_search_fg = "$gold"
status_search_bg = "$overlay"
status_success_fg = "$foam"
status_success_bg = "$highlightLow"
status_warning_fg = "$gold"
status_error_fg = "$love"
status_error_bg = "$highlightLow"
status_shortcut_fg = "$muted"
status_percent_fg = "$rose"
toc_hover_fg = "$text"
toc_header_fg = "$muted"
toc_active_bg = "$overlay"
toc_inactive_bg = "$surface"
toc_accent = "$rose"
toc_index_inactive = "$highlightHigh"
toc_primary_active = "$text"
toc_primary_inactive = "$subtle"
toc_secondary_inactive = "$highlightHigh"
toc_secondary_text_active = "$text"
toc_secondary_text_inactive = "$muted"

[markdown]
search_highlight_bg = "$highlightMed"
search_match_bg = "$gold"
code_gutter = "$highlightHigh"
blockquote_marker = "$muted"
list_level_1 = "$rose"
list_level_2 = "$foam"
list_level_3 = "$iris"
ordered_list = "$gold"
table_border = "$highlightMed"
table_separator = "$overlay"
table_header = "$rose"
table_cell = "$text"
heading_1 = "$love"
heading_2 = "$rose"
heading_3 = "$iris"
heading_4 = "$foam"
heading_other = "$gold"
heading_underline = "$highlightMed"
code_frame = "$highlightMed"
code_label = "$subtle"
inline_code_fg = "$rose"
inline_code_bg = "$overlay"
rule = "$highlightMed"
link_icon = "$foam"
link_text = "$foam"
link_hover = "$iris"
blockquote_text = "$subtle"
text = "$text"
strong_text = "$text"
latex_inline_fg = "$iris"
latex_inline_bg = "$overlay"
latex_block_fg = "$iris"
mermaid_keyword = "$love"
mermaid_arrow = "$pine"
mermaid_label = "$gold"
mermaid_block_fg = "$text"
mark_fg = "$base"
mark_bg = "$gold"
task_checked = "$foam"
task_unchecked = "$muted"
alert_note = "$foam"
alert_tip = "$pine"
alert_important = "$iris"
alert_warning = "$gold"
alert_caution = "$love"
footnote_ref = "$foam"
footnote_text = "$subtle"
