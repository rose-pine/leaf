# Rosé Pine Dawn theme for leaf.
# https://github.com/rose-pine/leaf

# leaf can't load .tmTheme files, so code blocks use a bundled syntect theme.
base = "arctic"
syntax = "InspiredGitHub"

[ui]
toc_bg = "#fffaf3"
toc_border = "#dfdad9"
content_bg = "#faf4ed"
scrollbar_hover = "#d7827e"
status_bg = "#fffaf3"
status_separator = "#9893a5"
status_brand_fg = "#faf4ed"
status_brand_bg = "#d7827e"
status_filename_fg = "#575279"
status_filename_bg = "#f2e9e1"
status_watch_fg = "#56949f"
status_watch_bg = "#f4ede8"
status_reloaded_fg = "#faf4ed"
status_reloaded_bg = "#56949f"
status_search_fg = "#ea9d34"
status_search_bg = "#f2e9e1"
status_success_fg = "#56949f"
status_success_bg = "#f4ede8"
status_warning_fg = "#ea9d34"
status_error_fg = "#b4637a"
status_error_bg = "#f4ede8"
status_shortcut_fg = "#9893a5"
status_percent_fg = "#d7827e"
toc_hover_fg = "#575279"
toc_header_fg = "#9893a5"
toc_active_bg = "#f2e9e1"
toc_inactive_bg = "#fffaf3"
toc_accent = "#d7827e"
toc_index_inactive = "#cecacd"
toc_primary_active = "#575279"
toc_primary_inactive = "#797593"
toc_secondary_inactive = "#cecacd"
toc_secondary_text_active = "#575279"
toc_secondary_text_inactive = "#9893a5"

[markdown]
search_highlight_bg = "#dfdad9"
search_match_bg = "#ea9d34"
code_gutter = "#cecacd"
blockquote_marker = "#9893a5"
