table_separator = "#f2e9e1"
table_header = "#d7827e"
table_cell = "#575279"
heading_1 = "#b4637a"
heading_2 = "#d7827e"
heading_3 = "#907aa9"
heading_4 = "#56949f"
heading_other = "#ea9d34"
heading_underline = "#dfdad9"
code_frame = "#dfdad9"
