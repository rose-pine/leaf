strong_text = "#575279"
latex_inline_fg = "#907aa9"
latex_inline_bg = "#f2e9e1"
latex_block_fg = "#907aa9"
mermaid_keyword = "#b4637a"
mermaid_arrow = "#286983"
mermaid_label = "#ea9d34"
