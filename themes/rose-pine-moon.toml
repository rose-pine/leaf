# Rosé Pine Moon theme for leaf.
# https://github.com/rose-pine/leaf

# leaf can't load .tmTheme files, so code blocks use a bundled syntect theme.
base = "ocean"
syntax = "base16-ocean.dark"

[ui]
toc_bg = "#2a273f"
toc_border = "#44415a"
content_bg = "#232136"
scrollbar_hover = "#ea9a97"
status_bg = "#2a273f"
status_separator = "#6e6a86"
status_brand_fg = "#232136"
status_brand_bg = "#ea9a97"
status_filename_fg = "#e0def4"
status_filename_bg = "#393552"
status_watch_fg = "#9ccfd8"
status_watch_bg = "#2a283e"
status_reloaded_fg = "#232136"
status_reloaded_bg = "#9ccfd8"
status_search_fg = "#f6c177"
status_search_bg = "#393552"
status_success_fg = "#9ccfd8"
status_success_bg = "#2a283e"
status_warning_fg = "#f6c177"
status_error_fg = "#eb6f92"
status_error_bg = "#2a283e"
status_shortcut_fg = "#6e6a86"
status_percent_fg = "#ea9a97"
toc_hover_fg = "#e0def4"
toc_header_fg = "#6e6a86"
toc_active_bg = "#393552"
toc_inactive_bg = "#2a273f"
toc_accent = "#ea9a97"
